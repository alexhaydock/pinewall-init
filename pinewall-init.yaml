---
package:
  name: pinewall-init
  version: "1.0.1"
  epoch: 0
  description: A very bad clone of cloud-init for init-ing Pinewall from EFI vars
  copyright:
    - license: MIT
  dependencies:
    runtime:
    replaces:
environment:
  contents:
    repositories:
      - http://dl-cdn.alpinelinux.org/alpine/v3.24/main
    packages:
      - busybox
  accounts:
    groups:
      - groupname: nonroot
        gid: 10000
    users:
      - username: nonroot
        uid: 10000
pipeline:
  - runs: |
      cp -a vendor/. "${{targets.destdir}}"/

      # Normalize permissions
      find "${{targets.destdir}}" -type f -exec chmod 644 {} +
      find "${{targets.destdir}}" -type d -exec chmod 755 {} +

      # Normalize timestamps
      find "${{targets.destdir}}" -exec touch -h -d "@0" {} +
